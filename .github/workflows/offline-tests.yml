name: Recipe Kotlin offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test tooling
        run: |
          python -m pip install --disable-pip-version-check brotli==1.1.0
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip \
            --output /tmp/kotlinc.zip
          unzip -q /tmp/kotlinc.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Validate offline generator, nutrition, restrictions, flags and contract
        run: bash scripts/test.sh
