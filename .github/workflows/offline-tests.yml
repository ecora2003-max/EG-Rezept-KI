name: Recipe Kotlin offline tests
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'transfer/**'
      - '.github/workflows/offline-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'transfer/**'
      - '.github/workflows/offline-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test tooling
        run: |
          python -m pip install --disable-pip-version-check brotli==1.1.0
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip \
            --output /tmp/kotlinc.zip
          unzip -q /tmp/kotlinc.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Validate offline generator, nutrition, restrictions, flags and contract
        run: bash scripts/test.sh
      - name: Validate pinned architecture schema (2020-12)
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          curl --fail --location --silent --show-error --retry 2 \
            https://raw.githubusercontent.com/ecora2003-max/EG-Architecture/d22862739bd0e3ef8451ce029e54f7c33ee53e40/contracts/v1/contract.schema.json \
            --output build/contract.schema.json
          python scripts/full_contract_check.py build/recipe-draft.json build/contract.schema.json
